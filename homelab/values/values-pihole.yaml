admin:
  enabled: true
  existingSecret: "pihole-creds"
  passwordKey: "password"

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - "pihole.fpetruca.space"

persistentVolumeClaim:
  storageClass: longhorn
  enabled: true
  accessModes: [ReadWriteMany]
  size: 2Gi

serviceDns:
  type: LoadBalancer
  annotations:
    metallb.universe.tf/allow-shared-ip: "same-ip"
  loadBalancerIP: 192.168.1.241
  ports:
    - protocol: UDP
      port: 53
      targetPort: 53
    - protocol: TCP
      port: 53
      targetPort: 53

serviceWeb:
  type: LoadBalancer
  annotations:
    metallb.universe.tf/allow-shared-ip: "same-ip"
  loadBalancerIP: 192.168.1.241
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
    - protocol: TCP
      port: 443
      targetPort: 443

replicaCount: 2

image:
  repository: cloudflare/cloudflared
  tag: latest
  pullPolicy: IfNotPresent

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"

tunnelId: "07d170ca-030d-4261-bb56-2b40a62348ed"
credentialsSecret: cloudflared-credentials

ingress:
  - hostname: "*.fpetruca.space"
    service: http://traefik.kube-system:80
  - service: http_status:404
